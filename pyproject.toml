[project]
name = "stac-eo-mcp"
version = "0.1.0"
description = "MCP server that lets AI agents search STAC catalogs and compute Sentinel-2 spectral indices (NDVI, NDWI, NBR)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "bbrauzzi", email = "brauzzi@gmail.com" }]
requires-python = ">=3.12"
keywords = ["mcp", "stac", "earth-observation", "sentinel-2", "ndvi", "remote-sensing", "llm", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp>=2.3,<3",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "pystac-client>=0.9",
    "planetary-computer>=1.0",
    "odc-stac>=0.5",
    "rioxarray>=0.17",
    "matplotlib>=3.9",
]

[project.urls]
Homepage = "https://github.com/bbrauzzi/stac-eo-mcp"
Repository = "https://github.com/bbrauzzi/stac-eo-mcp"
Issues = "https://github.com/bbrauzzi/stac-eo-mcp/issues"

[project.scripts]
stac-eo-mcp = "stac_eo_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.0",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stac_eo_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PT"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers -m 'not slow'"
filterwarnings = [
    # Third-party deprecation inside planetary-computer, not our code.
    "ignore:Could not parse bucket/account from href:UserWarning",
    "ignore:Support for class-based `config` is deprecated:DeprecationWarning:planetary_computer",
]
markers = [
    "slow: hits real STAC catalogs over the network (deselect with -m 'not slow')",
]
